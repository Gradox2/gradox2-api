name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Permite re-desplegar a mano desde la pestaña Actions (sin empujar un commit).
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gradox2

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: './gradox2/pom.xml'

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Ejecutar Tests (con H2 y Fake S3)
      run: ./mvnw test -B

  # Las migraciones Flyway son dialecto PostgreSQL y el perfil de tests usa H2
  # con Flyway apagado, asi que un desajuste entre migraciones y entidades solo
  # se descubriria al arrancar produccion (ddl-auto=validate). Este job aplica
  # V1..Vn sobre un PostgreSQL real y valida el mapeo JPA contra ese schema.
  migrations:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gradox2

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradoxdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/gradoxdb
      POSTGRES_TEST_USER: postgres
      POSTGRES_TEST_PASSWORD: postgres

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: './gradox2/pom.xml'

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Aplicar migraciones Flyway y validar entidades (PostgreSQL)
      run: ./mvnw test -B -Dtest=PostgresMigrationIT

  # Publica el contrato OpenAPI que consume el frontend. El JSON se genera en
  # cada corrida y viaja como artefacto: versionarlo obligaba a un diff enorme
  # en cada cambio de API y se desincronizaba en silencio.
  openapi:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./gradox2

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21 (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: './gradox2/pom.xml'

    - name: Dar permisos de ejecución a Maven Wrapper
      run: chmod +x mvnw

    - name: Generar openapi.json
      run: ./mvnw test -B -Dtest=OpenApiContractTest -Dopenapi.export=true

    - name: Publicar el contrato como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: openapi
        path: gradox2/target/openapi.json

  # Despliegue a Render mediante un Deploy Hook.
  #
  # El hook es una CREDENCIAL: quien tenga la URL puede disparar despliegues de
  # este servicio, asi que vive en el secret RENDER_DEPLOY_HOOK_URL y nunca en el
  # repositorio. Para que el gate tenga sentido hay que desactivar el Auto-Deploy
  # del servicio en Render (Settings -> Build & Deploy -> Auto-Deploy: No); si no,
  # Render despliega en cada push por su cuenta y estos tests no bloquean nada.
  #
  # `needs` incluye `migrations` a proposito: Flyway corre al arrancar la app, asi
  # que una migracion rota tumba el servicio recien desplegado.
  deploy:
    runs-on: ubuntu-latest
    needs: [ build-and-test, migrations, openapi ]
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'

    steps:
    - name: Disparar el deploy en Render
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
          echo "::error::Falta el secret RENDER_DEPLOY_HOOK_URL (Settings -> Secrets and variables -> Actions)."
          exit 1
        fi
        # El codigo HTTP se evalua explicitamente: sin esto una redireccion 3xx
        # dejaria el job en verde sin haber desplegado nada.
        response_file="$(mktemp)"
        http_status="$(curl --silent --show-error --max-time 30 \
          --output "${response_file}" --write-out '%{http_code}' \
          -X POST "${RENDER_DEPLOY_HOOK_URL}")" || {
            echo "::error::No se pudo contactar el Deploy Hook de Render (fallo de red o timeout)."
            exit 1
          }
        echo "Render respondio HTTP ${http_status}"
        # El cuerpo trae el id del deploy: es diagnostico, no el gate. Si no se
        # puede leer se avisa explicitamente en vez de taparlo con "|| true".
        if [ -f "${response_file}" ]; then
          cat "${response_file}"
        else
          echo "::warning::No se pudo leer el cuerpo de la respuesta del Deploy Hook."
        fi
        # Un estado vacio o no numerico haria fallar el test numerico sin abortar
        # el job (bash -e no sale dentro de la condicion de un if).
        case "${http_status}" in
          [0-9][0-9][0-9]) ;;
          *)
            echo "::error::El Deploy Hook devolvio un estado HTTP invalido ('${http_status}')."
            exit 1
            ;;
        esac
        if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
          echo "::error::Render no acepto el deploy (HTTP ${http_status})."
          exit 1
        fi
