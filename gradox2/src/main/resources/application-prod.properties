spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

s3.endpoint=${S3_ENDPOINT}
s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT}}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.bucket-name=${S3_BUCKET_NAME}
s3.region=auto
s3.presign.ttl-seconds=${S3_PRESIGN_TTL_SECONDS:120}
# WAVE2 S2: llamada total y por intento al almacenamiento de objetos.
s3.timeouts.api-call-ms=${S3_API_CALL_TIMEOUT_MS:10000}
s3.timeouts.api-call-attempt-ms=${S3_API_CALL_ATTEMPT_TIMEOUT_MS:5000}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}

# Correo: en Render los puertos SMTP de salida (25/465/587) estan bloqueados, asi que produccion sale
# por la API HTTP de Brevo sobre 443. Las propiedades spring.mail.* quedan solo por compatibilidad con
# perfiles que elijan el transporte SMTP.
app.mail.transport=${MAIL_TRANSPORT:brevo}
app.mail.api-key=${BREVO_API_KEY:}
app.mail.from=${MAIL_FROM:gradox2App@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Gradox2}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# WAVE2 S2: sin timeouts, un SMTP colgado deja el hilo esperando indefinidamente.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.base-url=${APP_BASE_URL}

# La IP del cliente la resuelve ClientIpResolver, no Spring (WAVE1 S3). Render tiene exactamente un
# proxy de confianza delante de la app, así que se toma el último salto de X-Forwarded-For: es el único
# que el cliente no puede falsificar. Con acceso directo al contenedor (sin proxy) usar 0.
server.forward-headers-strategy=none
app.rate-limit.trusted-proxy-hops=${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}
app.rate-limit.max-buckets=${RATE_LIMIT_MAX_BUCKETS:10000}
app.rate-limit.bucket-ttl-ms=${RATE_LIMIT_BUCKET_TTL_MS:1800000}

# Swagger/OpenAPI desactivado en produccion (los endpoints dejan de existir)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator: health checks con detalles solo para quien se autentica; métricas para el ADMIN.
# WAVE2 S1: el detalle de health publicaba componentes de DB y disco a cualquiera, y las métricas
# de login/carga no pueden quedar abiertas. No hay exporter externo: se consultan por la API.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Info endpoint: identifica la versión desplegada
info.app.name=Gradox2
info.app.version=0.1.0
info.app.java.version=21

# --- HIKARICP CONNECTION POOL (Supabase Tuning) ---
# Número máximo de conexiones simultáneas que Spring Boot abrirá
spring.datasource.hikari.maximum-pool-size=5
# Número mínimo de conexiones que se mantienen abiertas si no hay tráfico
spring.datasource.hikari.minimum-idle=1
# Tiempo máximo (ms) que una conexión puede estar inactiva antes de cerrarse (5 min)
spring.datasource.hikari.idle-timeout=300000
# Tiempo máximo (ms) que la app esperará si no hay conexiones libres (20 seg)
spring.datasource.hikari.connection-timeout=20000
# Tiempo máximo de vida (ms) de una conexión para evitar bloqueos de red (14 min)
spring.datasource.hikari.max-lifetime=840000

# Sólo el sitio publicado puede llamar a la API desde un navegador (WAVE1 S5).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://gradox2.github.io}

# WAVE2 S3: cache de catalogo acotada (grados, cursos, asignaturas).
app.cache.ttl-seconds=${CACHE_TTL_SECONDS:600}
app.cache.max-size=${CACHE_MAX_SIZE:1000}
